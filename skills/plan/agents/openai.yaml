interface:
  display_name: "計画"
  short_description: "経緯を知らない実装者向けの具体的で自己完結した計画の作成"
  default_prompt: "$plan を使って Tech Lead の設計書として計画して。経緯を知らない SE3年目程度の新規参画者を読み手とし、計画本文だけで実装と検証を開始できる自己完結した内容にして。設計判断は採用案を一つに確定し、変更対象を独立して実装・テストできる項目に分け、変更理由、対象ファイルと対象識別子、変更前後の振る舞い、既存実装の参照先と採用理由、制御・データフロー、エラー処理、互換性、テスト観点、完了条件、対象外、実装契約、検証、残リスクを明記して。実装に影響する未確認事項が残る場合は確定せず、事実不足は research、判断は grilling に戻して。"
